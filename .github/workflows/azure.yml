name: Produção no Azure
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: azure-producao
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || vars.VITE_HASURA_URL != '' || vars.VITE_PARSE_URL != ''
    runs-on: ubuntu-latest
    env:
      VITE_PROVIDER: ${{ vars.VITE_PROVIDER }}
      VITE_HASURA_URL: ${{ vars.VITE_HASURA_URL }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
      VITE_PARSE_URL: ${{ vars.VITE_PARSE_URL }}
      VITE_PARSE_APP_ID: ${{ vars.VITE_PARSE_APP_ID }}
      VITE_PARSE_JS_KEY: ${{ vars.VITE_PARSE_JS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validar configuração de produção
        run: node scripts/check-config.mjs
      - run: npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
