name: Integração Parse
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, deploy/back4app-container]
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jogo
          POSTGRES_PASSWORD: parse-ci-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:parse-ci-local@127.0.0.1:5432/jogo
      PARSE_APP_ID: jogo-ci
      PARSE_JS_KEY: chave-publica-ci
      PARSE_MASTER_KEY: chave-administrativa-descartavel-do-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/back4app/package-lock.json
      - name: Instalar o backend
        run: npm ci --prefix backend/back4app
      - name: Testar cadastro, login, persistência e classificação
        run: |
          node backend/back4app/container/server.cjs > parse-ci.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';

          async function request(path, body, session) {
            const headers = {
              'Content-Type': 'application/json',
              'X-Parse-Application-Id': process.env.PARSE_APP_ID,
              'X-Parse-JavaScript-Key': process.env.PARSE_JS_KEY,
            };
            if (session) headers['X-Parse-Session-Token'] = session;
            const response = await fetch('http://127.0.0.1:8080/parse' + path, {
              method: body ? 'POST' : 'GET',
              headers,
              body: body && JSON.stringify(body),
              signal: AbortSignal.timeout(5000),
            });
            const payload = await response.json();
            assert.ok(response.ok, `${path}: ${payload.error ?? response.status}`);
            return payload;
          }

          async function player(username) {
            const credentials = {username, password: 'senha-de-integracao-ci'};
            const account = await request('/users', credentials);
            const login = await request('/login', credentials);
            assert.equal(login.objectId, account.objectId);
            assert.ok(login.sessionToken);
            return {id: login.objectId, session: login.sessionToken};
          }

          async function call(player, name, params = {}) {
            return (await request('/functions/' + name, params, player.session)).result;
          }

          const x = await player('Jogador X');
          const o = await player('Jogador O');
          await call(x, 'salvarPerfil', {nome: 'Jogador X'});
          await call(o, 'salvarPerfil', {nome: 'Jogador O'});
          const room = await call(x, 'criarSala');
          const sala = room.id;
          await call(o, 'entrarSala', {codigo: room.codigo_sala});
          for (const [player, casa] of [[x, 0], [o, 3], [x, 1], [o, 4], [x, 2]]) {
            await call(player, 'jogar', {sala, casa});
          }
          const persisted = await call(o, 'partida', {sala});
          assert.equal(persisted.status, 'finalizada');
          assert.equal(persisted.vencedor_id, x.id);
          assert.deepEqual(persisted.tabuleiro, ['X', 'X', 'X', 'O', 'O', null, null, null, null]);
          const score = await call(o, 'placar');
          assert.deepEqual(score.map(row => [row.jogador_id, row.pontos]), [[x.id, 3], [o.id, 0]]);
          console.log('Cadastro, login, partida persistida e placar verificados.');
          JS
      - name: Mostrar log do Parse em caso de falha
        if: failure()
        run: test ! -f parse-ci.log || cat parse-ci.log
